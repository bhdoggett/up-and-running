name: Release

# Builds installers for macOS (Apple Silicon + Intel) and Windows, then attaches
# them to a draft GitHub Release. Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Can also be run by hand from the Actions tab (workflow_dispatch).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Up and Running ${{ github.ref_name }}"
          releaseBody: |
            Download the installer for your platform below.

            - **macOS (Apple Silicon)** — `_aarch64.dmg`
            - **macOS (Intel)** — `_x64.dmg`
            - **Windows** — `_x64-setup.exe` or `_x64_en-US.msi`

            These builds are unsigned: on macOS right-click the app and choose
            Open the first time; on Windows choose "More info" then "Run anyway".
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
